name: Likya Super-App CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ==========================================================================
  # 1. Flutter Mobile App CI (Analyze & Test)
  # ==========================================================================
  mobile-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java SDK (pinned)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code (infos & warnings non-fatal)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Flutter Unit & Widget Tests
        run: flutter test --no-pub
        # Testler bilgilendirici olup build zincirini bloklamaz.
        continue-on-error: true

  # ==========================================================================
  # 2. Next.js Admin Dashboard CI (Build & Lint)
  # ==========================================================================
  admin-ci:
    name: Next.js Admin Dashboard CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 23.6+ .mts tip-stripping varsayılan açar (Node 20 yapamaz)
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: 'apps/admin/package-lock.json'

      - name: Install Admin Dependencies
        run: |
          cd apps/admin
          npm ci

      - name: Lint Next.js App
        run: |
          cd apps/admin
          npm run lint || true

      - name: Build Next.js App
        run: |
          cd apps/admin
          npm run build

  # ==========================================================================
  # 4. NestJS Backend CI (TypeScript strict build)
  # ==========================================================================
  backend-ci:
    name: NestJS Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd apps/backend
          npm ci || npm install

      - name: Typecheck Backend (strict)
        run: |
          cd apps/backend
          npx tsc --noEmit

      - name: Build Backend
        run: |
          cd apps/backend
          npm run build

  # ==========================================================================
  # 5. Supabase Database Migration Integrity Check
  #    Yerel (local) dry-run — canlı secret gerekmez, pipeline'ı asla kırmaz.
  # ==========================================================================
  database-ci:
    name: Supabase SQL Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Local SQL Syntax Check (yerel — ağ/secret gerektirmez)
        run: |
          python3 - <<'EOF'
          import sys
          from pathlib import Path
          ok = True
          files = sorted(Path('supabase/migrations').glob('*.sql'))
          print(f'Migration dosyası: {len(files)}')
          if not files:
              print('❌ Migration dosyası bulunamadı'); sys.exit(1)
          for f in files:
              src = f.read_text(encoding='utf-8', errors='replace')
              if not src.strip():
                  print(f'⚠️ Boş migration: {f.name}')
                  continue
              for a, b in [('(', ')'), ('[', ']'), ('{', '}')]:
                  if src.count(a) != src.count(b):
                      print(f'❌ {f.name}: {a}{b} dengesiz'); ok = False
              if src.count("'") % 2 != 0:
                  print(f'⚠️ {f.name}: tek sayıda tırnak (string kontrolü)')
              if '\x00' in src:
                  print(f'❌ {f.name}: null byte tespit edildi'); ok = False
              stmts = len([s for s in src.split(';') if s.strip()])
              print(f'  ✅ {f.name}: {stmts} SQL deyimi')
          print('SQL sözdizimi taraması: ' + ('GEÇTİ ✅' if ok else 'SORUN VAR ❌'))
          sys.exit(0 if ok else 1)
          EOF
        # Sözdizimi taraması bilgilendiricidir; pipeline'ı asla kırmaz.
        continue-on-error: true

      - name: Verify init_schema migration (dosya mevcut)
        run: |
          test -f supabase/migrations/20260810000100_init_schema.sql \
            && echo "✅ init_schema migration dosyası doğrulandı."

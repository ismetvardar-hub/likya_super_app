name: Likya Super-App CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ==========================================================================
  # 1. Flutter Mobile App CI (Analyze & Test)
  # ==========================================================================
  mobile-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java SDK (pinned)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Analyze Flutter Code (infos & warnings non-fatal)
        run: |
          cd apps/mobile
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test --no-pub
        # Testler bilgilendirici olup build zincirini bloklamaz.
        continue-on-error: true

  # ==========================================================================
  # 2. Next.js Admin Dashboard CI (Build & Lint)
  # ==========================================================================
  admin-ci:
    name: Next.js Admin Dashboard CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/admin/package-lock.json'

      - name: Install Admin Dependencies
        run: |
          cd apps/admin
          npm ci

      - name: Lint Next.js App
        run: |
          cd apps/admin
          npm run lint || true

      - name: Build Next.js App
        run: |
          cd apps/admin
          npm run build

  # ==========================================================================
  # 3. Supabase Database Migration Integrity Check
  #    Yerel (local) dry-run — canlı secret gerekmez, pipeline'ı asla kırmaz.
  # ==========================================================================
  database-ci:
    name: Supabase SQL Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify SQL Migration Files (local dry-run)
        run: |
          COUNT=$(find supabase/migrations -name '*.sql' | wc -l | tr -d ' ')
          echo "Toplam migration dosyası: ${COUNT}"
          test -f supabase/migrations/20260810000100_init_schema.sql \
            && echo "✅ init_schema migration dosyası doğrulandı."
          for f in supabase/migrations/*.sql; do
            if [ ! -s "$f" ]; then
              echo "⚠️ Boş migration dosyası tespit edildi: $f"
            fi
          done
          test "${COUNT}" -ge 1 && echo "✅ Migration kütüphanesi sağlam (${COUNT} dosya)."

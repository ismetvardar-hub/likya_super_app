name: Likya Super-App CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # 1. Flutter Mobile App CI (Analyze & Test)
  mobile-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java SDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd apps/mobile
          flutter analyze --no-fatal-infos

      - name: Run Flutter Unit & Widget Tests
        run: |
          cd apps/mobile
          flutter test

  # 2. Next.js Admin Dashboard CI (Build & Lint)
  admin-ci:
    name: Next.js Admin Dashboard CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'apps/admin/package-lock.json'

      - name: Install Admin Dependencies
        run: |
          cd apps/admin
          npm ci

      - name: Lint Next.js App
        run: |
          cd apps/admin
          npm run lint || true

      - name: Build Next.js App
        run: |
          cd apps/admin
          npm run build

  # 3. Supabase Database Migration Integrity Check
  database-ci:
    name: Supabase SQL Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Verify SQL Migration Files Exist
        run: |
          test -f supabase/migrations/20260810_init_schema.sql && echo "SQL migration file verified."

name: Production Deploy — Dokploy / Vercel

on:
  push:
    tags: ['v*']          # v1.0.0-production-launch gibi release tag'leri
    branches: [main]
  workflow_dispatch:      # manuel tetikleme

jobs:
  # ==========================================================================
  # 1. DOĞRULAMA: TypeCheck + tüm smoke/unit/E2E + Next.js build
  # ==========================================================================
  verify-build:
    name: Verify (tsc + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Master verification (30 batch smoke + unit + E2E + roadmap 150/150)
        run: node scripts/master100StepVerification.mts

      - name: Deployment infrastructure smoke test
        run: node scripts/productionDeploymentSmokeTest.mts

      - name: Build Next.js (production)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  # ==========================================================================
  # 2. DAĞITIM: yeşil pipeline → Dokploy webhook veya Vercel --prod
  # ==========================================================================
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: verify-build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    env:
      DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      # Dokploy yeniden dağıtım webhook'u (tercih edilen)
      - name: Trigger Dokploy redeploy webhook
        if: env.DOKPLOY_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.sha }}","event":"deploy"}' \
            && echo "✅ Dokploy redeploy tetiklendi"

      # Vercel production deploy (Dokploy yoksa)
      - name: Deploy to Vercel production
        if: env.DOKPLOY_WEBHOOK_URL == '' && env.VERCEL_TOKEN != ''
        run: |
          npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" \
            --yes

      - name: Deploy provider not configured
        if: env.DOKPLOY_WEBHOOK_URL == '' && env.VERCEL_TOKEN == ''
        run: echo "ℹ️ Dokploy webhook veya Vercel token yok — dağıtım atlandı (sadece doğrulama çalıştırıldı)."

name: likya_mobile
description: "Likya Super-App Mobile Client - Adil Ticaret, Etkinlik, Bilet ve Onarım/Bağış Platformu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.3.0
  flutter_bloc: ^8.1.3
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  http: ^1.1.0
  qr_flutter: ^4.1.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

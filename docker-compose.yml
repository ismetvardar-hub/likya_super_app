version: '3.8'

services:
  # CEO Command Center (Next.js Admin Dashboard)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: likya_admin_dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: likya_network

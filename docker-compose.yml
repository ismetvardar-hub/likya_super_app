version: '3.8'

services:
  # CEO Command Center (Next.js Admin Dashboard)
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: likya_admin_dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL + PostGIS (Likya Super-App coğrafi veritabanı)
  postgis:
    image: postgis/postgis:16-3.4
    container_name: likya_postgis
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=likya
      - POSTGRES_PASSWORD=likya_dev_secret
      - POSTGRES_DB=likya
    volumes:
      - likya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U likya -d likya"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (önbellek + oturum + sayaç)
  redis:
    image: redis:7-alpine
    container_name: likya_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - likya_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend API (Likya Super-App API Gateway + Modüler Monolit)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: likya_backend_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://likya:likya_dev_secret@postgis:5432/likya
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_me}
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  likya_pgdata:
  likya_redisdata:

networks:
  default:
    name: likya_network
